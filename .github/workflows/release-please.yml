name: Release Please

# release-please opens a "chore(main): release vX.Y.Z" PR whenever conventional
# commits land on main. Merging that PR bumps Cargo.toml/Cargo.lock and
# CHANGELOG.md and creates the vX.Y.Z tag + GitHub Release.
#
# We authenticate with a PAT (RELEASE_PLEASE_TOKEN) rather than the default
# GITHUB_TOKEN. Events caused by GITHUB_TOKEN do not trigger other workflows,
# so a tag created with it would never start release.yml. A PAT-authored push
# does fire `on: push: tags`, which means release.yml runs natively and we can
# drop the old `gh workflow run` hand-off entirely (no output gates, no
# Actions:write permission, no tag-propagation race).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Require RELEASE_PLEASE_TOKEN
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "${RELEASE_PLEASE_TOKEN}" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN is not set. Create a PAT with Contents, Pull requests and Issues write access and add it as a repository secret, otherwise tags created here will not trigger release.yml."
            exit 1
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
