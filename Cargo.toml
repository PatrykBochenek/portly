[package]
name = "portly"
version = "0.2.1"
edition = "2021"
description = "Cross-platform Python port management made simple"
license = "MIT"
repository = "https://github.com/PatrykBochenek/portly"
keywords = ["port", "tcp", "network", "process", "dev-tools"]
categories = ["command-line-utilities", "network-programming"]
authors = ["Patryk Bochenek <contact@patrykbochenek.com>"]
rust-version = "1.85"

[lib]
name = "portly"
crate-type = ["cdylib", "rlib"]

[features]
# Enabled by maturin when building the extension; left off for `cargo test`.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = "0.29"
port_check = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }

[dev-dependencies]
# Lets `cargo test` initialize the interpreter for bindings tests. Dev-deps
# are not compiled for the extension build, so the shipped module is unaffected.
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
